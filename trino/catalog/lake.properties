# ── lake 카탈로그: SeaweedFS(로컬 S3)에 있는 파일을 테이블처럼 조회 ─────────────────────
# Trino에서는 lake.<스키마>.<테이블> 로 접근
connector.name=hive

# 테이블 정의(스키마·컬럼·파일 위치)를 어디에 저장할지
# 실무: Hive Metastore 서버나 AWS Glue / 로컬 연습: S3 안의 파일로 저장 (서버 추가 불필요)
hive.metastore=file
hive.metastore.catalog.dir=s3://adwhale-lake/metastore

# S3 접속 (SeaweedFS). 진짜 AWS S3로 바꿀 땐 endpoint/path-style 줄을 지우고 리전·키만 바꾸면 됨
fs.native-s3.enabled=true
s3.endpoint=http://seaweedfs:8333
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:S3_SECRET_KEY}

# 외부 위치(external_location)를 가진 테이블에도 INSERT 허용 (나중에 Parquet 변환할 때 사용)
hive.non-managed-table-writes-enabled=true
# Trino가 새로 만드는 테이블의 기본 파일 형식
hive.storage-format=PARQUET
