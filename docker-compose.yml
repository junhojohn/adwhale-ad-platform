# adwhale-ad-platform 로컬 인프라
# 실행: docker compose up -d   /   종료: docker compose down   (데이터까지 삭제: docker compose down -v)
name: adwhale

services:
  # ── Kafka 브로커 (KRaft 모드: Zookeeper 없이 단독 실행) ──────────────────────
  kafka:
    image: apache/kafka:4.1.0
    container_name: adwhale-kafka
    ports:
      - "9092:9092"   # Mac(호스트)에서 접속하는 포트 → 나중에 Spring Boot 앱이 localhost:9092로 붙음
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller        # 브로커 + 컨트롤러를 한 노드가 겸함 (로컬 개발용)
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # 리스너 3개: 도커 내부용(29092), 호스트용(9092), 컨트롤러용(9093)
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # 브로커가 1대뿐이라 복제본 수는 전부 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"      # 오타난 토픽이 자동 생성되지 않도록 → 토픽은 kafka-init에서 명시적으로 생성
      KAFKA_LOG_RETENTION_HOURS: 168                # 메시지 보관 7일 (Kafka 자체도 디스크에 저장함)
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  # ── 토픽 생성 (한 번 실행하고 종료되는 컨테이너) ─────────────────────────────
  kafka-init:
    image: apache/kafka:4.1.0
    container_name: adwhale-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in ad-request ad-impression ad-click; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 \
            --create --if-not-exists --topic "$$t" --partitions 3 --replication-factor 1
          # DLQ: 처리 실패한 메시지 보관용. 실패 건은 적으니 파티션 1개, 원인 분석할 시간을 위해 30일 보관
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 \
            --create --if-not-exists --topic "$$t-dlq" --partitions 1 --replication-factor 1 \
            --config retention.ms=2592000000
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
    restart: "no"

  # ── Kafka UI (브라우저에서 토픽/메시지 확인용) ──────────────────────────────
  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: adwhale-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8989:8080"   # 8080은 나중에 API 서버용으로 비워둠
    environment:
      KAFKA_CLUSTERS_0_NAME: adwhale-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # ── 로드밸런서 (nginx) ─────────────────────────────────────────────────────
  # SDK → localhost:8080 (nginx) → Mac의 ad-api :8081 / :8082 로 분배
  lb:
    image: nginx:1.27-alpine
    container_name: adwhale-lb
    ports:
      - "8080:80"
    volumes:
      - ./nginx/ad-api.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 컨테이너 안에서 Mac(호스트)에 접근하기 위한 주소

  # ── MySQL (원본 이벤트 + 시간별 집계 저장) ──────────────────────────────────
  # 비밀번호는 로컬 개발용 기본값. 바꾸려면 루트에 .env 파일을 만들어 MYSQL_PASSWORD=... 로 덮어쓰기 (.env는 git 제외)
  mysql:
    image: mysql:8.4
    container_name: adwhale-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: adwhale                         # 처음 실행 시 DB 생성
      MYSQL_USER: adwhale                             # 앱이 접속할 계정 (adwhale DB에 대한 권한만 가짐)
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-adwhale}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00                    # NOW() 등 DB 시간 함수도 KST 기준
    volumes:
      - mysql-data:/var/lib/mysql
      # 스키마(테이블)는 Flyway가 관리: ./gradlew :ad-db-migration:bootRun  (또는 ./scripts/dev.sh migrate)
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── SeaweedFS (로컬 S3: 원본 이벤트 파일 저장소 = 데이터 레이크) ────────────
  # S3와 API가 같아서, 나중에 진짜 AWS S3로 바꿀 때 접속 주소/키 설정만 바꾸면 됨
  # (원래 MinIO를 쓰려 했으나 MinIO는 2025년 말 개발 중단 + Docker 이미지 배포 중단)
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: adwhale-seaweedfs
    # master + volume + filer + S3 게이트웨이를 한 컨테이너에서 실행 (로컬 연습용 단일 노드)
    command: >
      server -dir=/data
      -ip=seaweedfs -ip.bind=0.0.0.0
      -master.volumeSizeLimitMB=1024
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"   # S3 API  (앱/Trino/aws cli가 접속하는 주소)
      - "8888:8888"   # Filer 웹 UI (브라우저로 버킷 안 파일 보기: /buckets/adwhale-lake/)
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro   # S3 접속 키 (로컬 개발용)
    # healthcheck 없음: 이미지 안에 확인용 도구(curl 등)가 일정하지 않음
    # → 대신 s3-init이 S3 API에 실제로 접속될 때까지 재시도하며 기다림

  # 버킷 생성 (kafka-init처럼 한 번 실행하고 종료)
  # 진짜 AWS에서 쓰는 aws cli 그대로 → endpoint만 로컬로 바꿔서 사용
  s3-init:
    image: amazon/aws-cli:latest
    container_name: adwhale-s3-init
    depends_on:
      seaweedfs:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: adwhale
      AWS_SECRET_ACCESS_KEY: adwhale-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        S3="aws --endpoint-url http://seaweedfs:8333 s3"
        for i in $$(seq 1 60); do $$S3 ls >/dev/null 2>&1 && break; echo "S3 대기 중... $$i"; sleep 2; done
        $$S3 ls >/dev/null || { echo "S3 접속 실패 → docker compose logs seaweedfs 확인"; exit 1; }
        aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket adwhale-lake 2>/dev/null || $$S3 mb s3://adwhale-lake
        $$S3 ls
    restart: "no"

  # ── Trino (분산 SQL 엔진: S3의 파일을 SQL로 조회 / MySQL도 같이 조회 가능) ──────
  trino:
    image: trinodb/trino:476
    container_name: adwhale-trino
    ports:
      - "8085:8080"   # Trino 웹 UI + JDBC (8080은 로드밸런서가 사용 중이라 8085로)
    environment:
      # catalog/*.properties 안의 ${ENV:...} 에 들어감 → 키를 설정 파일에 직접 쓰지 않음
      S3_ACCESS_KEY: adwhale
      S3_SECRET_KEY: adwhale-secret
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-adwhale}
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
    depends_on:
      s3-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2g   # Mac 메모리 보호 (Trino는 JVM이라 기본으로 메모리를 많이 잡음)

volumes:
  kafka-data:
  mysql-data:
  seaweedfs-data:
