spring:
  application:
    name: ad-db-migration
  main:
    web-application-type: none          # 웹 서버 없음 → 마이그레이션 끝나면 종료
  datasource:
    url: jdbc:mysql://localhost:3306/adwhale?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: adwhale
    password: ${MYSQL_PASSWORD:adwhale}
  flyway:
    enabled: true
    locations: classpath:db/migration   # V1__init.sql, V2__... 가 있는 위치 (기본값과 동일)
    # 이미 테이블이 있는데 Flyway 이력(flyway_schema_history)이 없는 DB (= 지금 로컬 DB)
    # → "V1까지는 이미 적용됨"으로 표시만 하고 V1은 실행하지 않음. 데이터 그대로 유지.
    # 빈 DB(새로 만든 볼륨)에서는 이 설정과 상관없이 V1부터 실행된다.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "init (기존 DB를 V1으로 표시)"
