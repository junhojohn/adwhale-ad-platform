# ── 로드밸런서 설정 (nginx) ────────────────────────────────────────────
# SDK는 항상 localhost:8080 하나만 알고, nginx가 뒤에 있는 ad-api 여러 대에 나눠 보낸다.

# 요청을 받을 ad-api 서버 목록 (Mac에서 실행 중인 ad-api → 컨테이너 안에서는 host.docker.internal 로 접근)
upstream ad_api {
    # 기본 분배 방식: 라운드로빈 (1번 → 2번 → 1번 → 2번 ...)
    # max_fails=1 fail_timeout=10s : 연결이 1번 실패하면 10초 동안 그 서버로는 보내지 않음 (수동 헬스체크)
    server host.docker.internal:8081 max_fails=1 fail_timeout=10s;
    server host.docker.internal:8082 max_fails=1 fail_timeout=10s;

    keepalive 32;   # ad-api와의 연결을 재사용해서 매 요청마다 새로 연결하는 비용을 줄임
}

server {
    listen 80;

    # nginx 자체가 살아있는지 확인용
    location = /lb-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://ad_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # ad-api가 진짜 클라이언트(SDK) 정보를 알 수 있도록 헤더로 전달
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 한 서버에 연결이 안 되면(error/timeout) 다른 서버로 다시 보냄
        # POST는 "요청을 이미 보낸 뒤"에는 재시도하지 않음 → 중복 이벤트 방지 (nginx 기본 동작)
        proxy_next_upstream error timeout;
        proxy_connect_timeout 1s;   # 죽은 서버에 연결 시도를 오래 끌지 않도록
        proxy_read_timeout 10s;

        # 이번 요청을 어느 ad-api가 처리했는지 응답 헤더로 보여줌 (학습/디버깅용)
        add_header X-Upstream $upstream_addr always;
    }
}
