server:
  port: 8090

spring:
  application:
    name: ad-dashboard-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://localhost:3306/adwhale?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: adwhale
    password: ${MYSQL_PASSWORD:adwhale}
    hikari:
      maximum-pool-size: 5
      read-only: true          # 조회 전용 앱 → 실수로 UPDATE/DELETE 해도 DB가 거부

management:
  endpoints:
    web:
      exposure:
        include: health,info
