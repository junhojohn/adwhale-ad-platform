spring:
  application:
    name: ad-log-consumer
  datasource:
    url: jdbc:mysql://localhost:3306/adwhale?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: adwhale
    password: ${MYSQL_PASSWORD:adwhale}   # 환경변수가 있으면 그 값, 없으면 로컬 기본값
    hikari:
      maximum-pool-size: 5              # DB 커넥션을 최대 5개까지 재사용 (매번 새로 연결하지 않음)
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ad-log-writer           # 기본 그룹 (파일 저장). DB 저장 리스너는 ad-db-writer 그룹을 따로 씀
      auto-offset-reset: earliest

adwhale:
  log:
    dir: ./logs   # 실행 위치 기준 상대경로. 실제 절대경로는 앱 시작 시 로그로 출력됨
